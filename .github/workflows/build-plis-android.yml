name: Build PLIS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PLIS_ANDROID_INTEGRATED.zip'
      - '.github/workflows/build-plis-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract PLIS project ZIP
        shell: bash
        run: |
          ZIP_FILE="PLIS_ANDROID_INTEGRATED.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          fi
          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "Tidak menemukan ZIP proyek PLIS di root repository."
            exit 1
          fi
          mkdir -p plis-source
          unzip -q "$ZIP_FILE" -d plis-source
          if [ ! -f plis-source/package.json ]; then
            echo "package.json tidak ditemukan di root ZIP setelah ekstraksi."
            find plis-source -maxdepth 3 -name package.json -print
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and build web app
        working-directory: plis-source
        run: |
          npm install
          npm run build

      - name: Install Capacitor Android platform
        working-directory: plis-source
        run: |
          npx cap add android
          npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: plis-source/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLIS-Android-debug-APK
          path: plis-source/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
